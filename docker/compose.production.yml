services:
  redis:
    # Stack image is required: the server's RedisJSON gate refuses to boot
    # without the ReJSON module. `redis:7-alpine` ships without it and would
    # silently break versioning on a fresh deploy.
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - dbdata:/data
    networks:
      - apollon-internal
    command:
      - redis-stack-server
      # `redis-stack-server` defaults `dir` to `/var/lib/redis-stack`, NOT
      # `/data` like upstream `redis`. Without this flag the server writes
      # its AOF/RDB into the container's writable layer instead of the
      # `dbdata` volume — fine until the container is recreated, at which
      # point every write since the previous recreate is lost.
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - apollon-internal
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-apolloncase}
      - POSTGRES_USER=${POSTGRES_USER:-apolloncase}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apolloncase} -d ${POSTGRES_DB:-apolloncase}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  webapp:
    image: "ghcr.io/ls1intum/apollon/webapp:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Selects the bundled legal profile (imprint + privacy). Operators
      # forking Apollon should either pick a different bundled profile,
      # mount a /legal-overrides/ directory, or leave this empty to serve
      # the disclaimer (not valid for production). See docs/admin/legal-pages.md.
      - LEGAL_PROFILE=${LEGAL_PROFILE:-}
    networks:
      - apollon-network
    volumes:
      # First-party over-the-air live-update bundles for the mobile app, served
      # by this container's nginx at /live-updates/ (see nginx.conf). Populated
      # by the ios-live-update workflow on deploy; read-only in the container.
      # An absent/empty directory simply yields 404s and the app stays on its
      # shipped bundle, so this is safe before the first publish and for operators
      # who ship no mobile app.
      - "${LIVE_UPDATE_DIR:-/opt/apollon/app/live-updates}:/usr/share/nginx/html/live-updates:ro"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # diagrams-backend (Apollon's own server). Not publicly exposed at all - see
  # extension-backend below, which is the only path the webapp uses to reach
  # it. Kept on apollon-internal only, alongside its Redis and Postgres.
  server:
    image: "ghcr.io/ls1intum/apollon/server:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    expose:
      - "8000"
      - "4444"
    environment:
      # Engages production gating in the Express logger; see services/diagrams-backend/src/logger.ts.
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - WS_PORT=4444
      - REDIS_URL=redis://redis:6379
      - OWNER_SECRET=${OWNER_SECRET:?OWNER_SECRET must be set}
      - CORS_ORIGIN=${CORS_ORIGIN:-capacitor://localhost,ionic://localhost}
    networks:
      - apollon-internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # extension-backend is the API gateway: point Dokploy's domain for the API
  # at this service's port 8080. See docker/.env.example for every variable below.
  extension-backend:
    build:
      context: ..
      dockerfile: ./services/extension-backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-apolloncase}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-apolloncase}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Not a reviewed production migration strategy — see design.md's Non-Goals
      # and application-local.properties.example's note on ddl-auto=update.
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${ISSUER_URI:?ISSUER_URI must be set}
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      - APP_DIAGRAMS_BACKEND_BASE_URL=http://server:8000
      - APP_DIAGRAMS_BACKEND_WS_BASE_URL=ws://server:4444
    networks:
      - apollon-network
      - apollon-internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  # Dokploy's own reverse proxy attaches to whichever service/port it's
  # pointed at when you assign a domain - webapp and extension-backend are
  # the two meant to receive one. No backing store or diagrams-backend needs
  # to be reachable at all, so they never join this network.
  apollon-network:
    name: apollon-network
    driver: bridge
  apollon-internal:
    name: apollon-internal
    internal: true

volumes:
  dbdata:
  pgdata:
